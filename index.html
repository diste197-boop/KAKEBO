<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5B7F6A">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kakebo</title>
<style>
:root{
  --bg:#F3F6F4;--card:#fff;--ink:#22302a;--mute:#697a71;--line:#d7e0da;--acc:#5B7F6A;--on-acc:#fff;--soft:#EAF1EC;
  --neg:#b3472f;--warn-bg:#fff4d6;--warn-ink:#6b4e00;
  --cS:#4f7cac;--cV:#c0703a;--cC:#7a5ea8;--cE:#b0485a;--r:12px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111614;--card:#1a2220;--ink:#e5ede8;--mute:#94a59c;--line:#2c3934;--acc:#7fb095;--on-acc:#0d1411;--soft:#212c27;
  --neg:#e58b73;--warn-bg:#3a3118;--warn-ink:#f1d98a;
  --cS:#7fa8d4;--cV:#e09a64;--cC:#a58bd2;--cE:#e0788c;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html.curtain #app,html.curtain #nav,html.curtain #fab,html.curtain #sheetRoot{visibility:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:.8rem;margin:18px 2px 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.mute{color:var(--mute)}.small{font-size:.82rem}.neg{color:var(--neg)}
main{max-width:560px;margin:0 auto;padding:0 12px 170px}

/* barra superiore */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 12px 6px}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:6px}
.nav-btn{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:1.3rem;line-height:1}
.datebox{flex:1;position:relative;text-align:center;min-width:0}
.datebox .d{font-weight:700;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox .s{font-size:.8rem;color:var(--mute)}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.todaybtn{margin:2px auto 0;display:block;border:0;background:var(--soft);color:var(--acc);border-radius:20px;padding:2px 12px;font-size:.8rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r);padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner button{border:0;background:var(--warn-ink);color:var(--warn-bg);border-radius:8px;padding:6px 12px;white-space:nowrap}

/* tabelle saldi */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;font-weight:600;color:var(--mute);text-align:right;padding:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left}
td{padding:5px 0 5px 6px;text-align:right;border-top:1px solid var(--line);font-size:.88rem;white-space:nowrap}
td:first-child{padding-left:0;color:var(--mute);font-size:.85rem;white-space:normal}
tr.fin td{font-weight:700;color:var(--ink);background:var(--soft)}
tr.fin td:first-child{color:var(--ink);padding-left:6px}
.tap{cursor:pointer;text-decoration:underline dotted var(--mute)}
.in-m{width:100%;min-width:0;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.in-m.bad,.field.bad{border-color:var(--neg)}

/* categorie */
.cats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;background:var(--card);border-top:3px solid var(--c)}
.cat b{display:block;font-size:.8rem;color:var(--c)}
.cat span{display:block;font-size:.88rem;font-variant-numeric:tabular-nums}
.cS{--c:var(--cS)}.cV{--c:var(--cV)}.cC{--c:var(--cC)}.cE{--c:var(--cE)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.badge{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;font-weight:700;font-size:.85rem;flex:none}
html:not([data-x]) .badge{color:#fff}

/* chips ricorrenti */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:22px;padding:8px 12px;display:flex;align-items:center;white-space:nowrap}
.chip.add{border-style:dashed;color:var(--mute)}
.chip.ed{border-style:dashed;border-color:var(--acc)}
.hrow{display:flex;justify-content:space-between;align-items:center}
.mini{border:0;background:var(--soft);color:var(--acc);border-radius:20px;padding:4px 14px;font-size:.8rem;text-transform:none;letter-spacing:0;font-weight:600}

/* elenco spese */
.exp{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.exp:first-child{border-top:0}
.exp .t{flex:1;min-width:0}
.exp .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp .a{font-weight:600;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mute);padding:14px 0}

/* campi */
.field,.big,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.big{font-size:1.8rem;font-weight:700;text-align:right}
textarea{resize:vertical;min-height:64px}
.lbl{display:block;font-size:.8rem;color:var(--mute);margin:12px 2px 4px}
details summary{cursor:pointer;font-weight:600;padding:2px 0}
details .lbl:first-of-type{margin-top:10px}
.yn{display:flex;gap:8px}
.yn button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px}
.yn button.on{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}

/* bottoni */
.btn{border:0;background:var(--acc);color:var(--on-acc);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--neg)}
.btn.block{width:100%}
.row{display:flex;gap:8px;margin-top:16px}.row .btn{flex:1}
.list-btn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;text-align:left}
.list-btn:first-child{border-top:0}

/* navigazione */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;min-height:56px}
#nav button.on{color:var(--acc);font-weight:700}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:15;width:60px;height:60px;border-radius:50%;border:0;background:var(--acc);color:var(--on-acc);font-size:2rem;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.28)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.seg{display:grid;gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.four{grid-template-columns:1fr 1fr}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);min-height:46px}
.seg input:checked+span{background:var(--c,var(--acc));color:#fff;border-color:var(--c,var(--acc))}
.seg span b{font-size:1rem}
.seg span small{font-size:.78rem;opacity:.9}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:.92rem}
.chk input{width:20px;height:20px}
.err{color:var(--neg);font-size:.85rem;min-height:1.2em;margin-top:8px}

/* rate di scorta */
.rate{display:flex;gap:14px;align-items:center;justify-content:center;margin:10px 0 4px}
.rate button{width:52px;height:52px;border-radius:50%;border:2px solid var(--acc);background:var(--acc);color:var(--on-acc);font-weight:700}
.rate button.used{background:transparent;color:var(--acc)}

#toast{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:60;display:none;justify-content:center}
#toast div{background:#22302a;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:520px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#a9d9bf;font-weight:700;padding:0}

/* blocco PIN */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}
#lock h1{font-size:1.3rem;margin:0 0 4px}
#lock .sub{color:var(--mute);margin-bottom:18px;text-align:center;min-height:1.3em}
.dots{display:flex;gap:14px;margin:6px 0 8px;min-height:18px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin:14px 0}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.5rem}
.pad button.ghost{border:0;background:none;font-size:1rem;color:var(--mute)}
#lock .link{background:none;border:0;color:var(--mute);text-decoration:underline;margin-top:8px}
#lock .perr{color:var(--neg);min-height:1.4em;margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" aria-label="Aggiungi spesa" hidden>+</button>
<nav id="nav" hidden>
  <button data-tab="day"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Giorno</button>
  <button data-tab="week"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Settimana</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Impostazioni</button>
</nav>
<div id="sheetRoot"></div>
<div id="toast"></div>
<div id="lock" hidden></div>
<noscript>Per usare Kakebo serve JavaScript.</noscript>

<script>
'use strict';
/* =====================  utilità  ===================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const CATS = {S:'Sopravvivenza', V:'Svago e vizi', C:'Cultura e benessere', E:'Extra e imprevisti'};
const CK = ['S','V','C','E'];
const APP_VERSION = 'v3';
const KEY = 'kakebo.v1', PIN_KEY = 'kakebo.pin', FAIL_KEY = 'kakebo.fail';

/* denaro: sempre in centesimi (interi) per evitare errori di arrotondamento */
const n2 = c => (c / 100).toLocaleString('it-IT', {minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: 'always'});
const eur = c => n2(c) + ' €';
const cell = c => c ? n2(c) : '–';
function parseMoney(s) {
  s = String(s).trim().replace(/[\s€]/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(Number(s) * 100);
}
const toInput = c => c ? (c / 100).toFixed(2).replace('.', ',').replace(/,00$/, '') : '';

/* date: chiavi "AAAA-MM-GG" */
const pad = n => String(n).padStart(2, '0');
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const addDays = (k, n) => { const d = parseKey(k); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dow = k => (parseKey(k).getUTCDay() + 6) % 7;            // lunedì = 0
const mondayOf = k => addDays(k, -dow(k));
function isoWeek(k) {
  const d = parseKey(k); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7) + 3);
  const j4 = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((d - j4) / 864e5 - 3 + ((j4.getUTCDay() + 6) % 7)) / 7);
}
const fmtLong = k => new Intl.DateTimeFormat('it-IT', {weekday:'long', day:'numeric', month:'long', timeZone:'UTC'}).format(parseKey(k));
const fmtShort = k => new Intl.DateTimeFormat('it-IT', {day:'numeric', month:'short', timeZone:'UTC'}).format(parseKey(k));
const fmtDayName = k => new Intl.DateTimeFormat('it-IT', {weekday:'short', timeZone:'UTC'}).format(parseKey(k));

/* =====================  dati  ===================== */
function norm(d) {
  d = d && typeof d === 'object' ? d : {};
  return {
    v: 1,
    days: d.days || {},
    weeks: d.weeks || {},
    rate: Array.isArray(d.rate) && d.rate.length === 3 ? d.rate.map(Boolean) : [true, true, true],
    recur: Array.isArray(d.recur) ? d.recur : [],
    settings: Object.assign({lastBackup: null, lastMethod: 'conto', lastCat: 'S', lockSec: 60}, d.settings)
  };
}
function load() { try { return norm(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return norm({}); } }
let db = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast('⚠ Impossibile salvare: spazio o permessi del browser'); }
}
function ensureDay(k) {
  return db.days[k] ||= {exp: [], inc: {conto: 0, cash: 0}, open: null, refl: {imp: null, best: '', redo: '', next: '', note: ''}};
}
function pruneDay(k) {
  const d = db.days[k]; if (!d) return;
  const r = d.refl || {};
  if (!d.exp.length && !(d.inc?.conto) && !(d.inc?.cash) && !d.open && r.imp == null && !r.best && !r.redo && !r.next && !r.note) delete db.days[k];
}
function daySums(k) {
  const r = {conto: 0, cash: 0, cat: {S:0, V:0, C:0, E:0}, inc: {conto: 0, cash: 0}};
  const d = db.days[k]; if (!d) return r;
  for (const e of d.exp) { r[e.m === 'cash' ? 'cash' : 'conto'] += e.amt; r.cat[e.cat] = (r.cat[e.cat] || 0) + e.amt; }
  r.inc.conto = d.inc?.conto || 0; r.inc.cash = d.inc?.cash || 0;
  return r;
}
/* saldo iniziale = rettifica manuale del giorno, altrimenti saldo finale del giorno prima */
function balances(target) {
  const keys = Object.keys(db.days).sort();
  const start = keys.length && keys[0] < target ? keys[0] : target;
  let prev = null;
  for (let k = start, guard = 0; guard < 40000; k = addDays(k, 1), guard++) {
    const d = db.days[k], s = daySums(k);
    const open = d?.open ? {conto: d.open.conto, cash: d.open.cash} : (prev ? {...prev} : {conto: 0, cash: 0});
    const close = {conto: open.conto + s.inc.conto - s.conto, cash: open.cash + s.inc.cash - s.cash};
    prev = close;
    if (k === target) return {open, close, s, adjusted: !!d?.open};
  }
}

/* =====================  stato e interfaccia  ===================== */
const state = {tab: 'day', day: todayKey(), wk: mondayOf(todayKey()), lastToday: todayKey()};
const app = $('#app');
let installEvt = null;

function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<div><span>${esc(msg)}</span>${undo ? '<button id="undo">Annulla</button>' : ''}</div>`;
  t.style.display = 'flex';
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.style.display = 'none', undo ? 5000 : 3000);
  if (undo) $('#undo').onclick = () => { t.style.display = 'none'; undo(); };
}

/* sheet (finestra dal basso); il tasto Indietro di Android la chiude */
const sheetRoot = $('#sheetRoot');
let sheetOpen = false, ignorePop = 0;
function openSheet(inner, mount) {
  if (sheetOpen) return;
  sheetRoot.innerHTML = `<div class="sheet-bg"><div class="sheet" role="dialog">${inner}</div></div>`;
  sheetOpen = true;
  history.pushState({sheet: 1}, '');
  const bg = sheetRoot.firstChild;
  bg.addEventListener('click', e => { if (e.target === bg) closeSheet(); });
  $$('[data-x="close"]', bg).forEach(b => b.onclick = closeSheet);
  mount && mount($('.sheet', bg));
}
function closeSheet() {
  if (!sheetOpen) return;
  sheetOpen = false; sheetRoot.innerHTML = '';
  ignorePop++; history.back();
}
addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  if (sheetOpen) { sheetOpen = false; sheetRoot.innerHTML = ''; }
});

function render() {
  const t = state.tab;
  app.innerHTML = t === 'day' ? viewDay() : t === 'week' ? viewWeek() : viewSettings();
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#fab').hidden = t !== 'day';
  window.scrollTo(0, 0);
  updateTotals();
}

/* ---------- vista GIORNO ---------- */
function backupBanner() {
  const has = Object.values(db.days).some(d => d.exp.length);
  if (!has) return '';
  const lb = db.settings.lastBackup;
  const days = lb ? Math.floor((Date.now() - lb) / 864e5) : null;
  if (lb && days < 7) return '';
  return `<div class="banner"><span>${lb ? `Ultimo backup ${days} giorni fa` : 'Nessun backup ancora fatto'}</span><button data-act="backup">Salva ora</button></div>`;
}
function viewDay() {
  const k = state.day, d = db.days[k], b = balances(k);
  const exps = (d?.exp || []).slice().sort((a, c) => a.t - c.t);
  const isToday = k === todayKey();
  const r = d?.refl || {};
  const ed = !!state.recEdit && db.recur.length > 0;
  const rec = db.recur.map(x => `<button class="chip${ed ? ' ed' : ''}" data-act="${ed ? 'editrec' : 'rec'}" data-id="${x.id}"><i class="dot c${x.cat}"></i>${ed ? '✎&nbsp;' : ''}${esc(x.name)}${x.amt ? `&nbsp;<b>${n2(x.amt)}</b>` : ''}</button>`).join('');
  return `
  <div class="top"><div class="in">
    <button class="nav-btn" data-act="prev" aria-label="Giorno precedente">‹</button>
    <div class="datebox"><div class="d">${esc(fmtLong(k))}</div><div class="s">${parseKey(k).getUTCFullYear()} · settimana n° ${isoWeek(k)}</div>
      <input type="date" id="datepick" value="${k}" aria-label="Scegli la data"></div>
    <button class="nav-btn" data-act="next" aria-label="Giorno successivo">›</button>
  </div>${isToday ? '' : '<button class="todaybtn" data-act="today">Vai a oggi</button>'}</div>
  <main>
    ${backupBanner()}
    <div class="card">
      <table>
        <tr><th></th><th>Conto</th><th>Contanti</th><th>Totale</th></tr>
        <tr><td><span class="tap" data-act="openbal">Saldo iniziale${b.adjusted ? ' ✎' : ''}</span></td><td id="o-conto"></td><td id="o-cash"></td><td id="o-tot"></td></tr>
        <tr><td>+ Entrate<br><span class="small">accredito / contanti</span></td>
          <td><input class="in-m" inputmode="decimal" data-inc="conto" placeholder="0" value="${toInput(d?.inc?.conto)}" aria-label="Entrate accredito sul conto"></td>
          <td><input class="in-m" inputmode="decimal" data-inc="cash" placeholder="0" value="${toInput(d?.inc?.cash)}" aria-label="Entrate in contanti"></td><td id="i-tot"></td></tr>
        <tr><td>− Spese</td><td id="s-conto"></td><td id="s-cash"></td><td id="s-tot"></td></tr>
        <tr class="fin"><td>Saldo finale</td><td id="c-conto"></td><td id="c-cash"></td><td id="c-tot"></td></tr>
      </table>
    </div>
    <div class="cats4">${CK.map(c => `<div class="cat c${c}"><b>${c}</b><span id="cat-${c}"></span></div>`).join('')}</div>

    <h3 class="hrow">Ripetitive${db.recur.length ? `<button class="mini" data-act="toggrec">${ed ? 'Fine' : 'Modifica'}</button>` : ''}</h3>

const radio = (sh, name) => sh.querySelector(`input[name="${name}"]:checked`)?.value;

  const d = db.days[state.day], e = id ? d?.exp.find(x => x.id === id) : null;

  openSheet(`
    <h2>${e ? 'Modifica spesa' : 'Nuova spesa'}</h2>
    <label class="lbl" style="margin-top:0">Importo (€)</label>

  sh => {
    const amt = $('#f-amt', sh); setTimeout(() => amt.focus(), 50);
    const submit = () => {
      const a = parseMoney(amt.value);
      if (!(a > 0)) { $('#f-err', sh).textContent = 'Inserisci un importo valido (es. 12,50)'; return; }
      const c = radio(sh, 'cat'), mm = radio(sh, 'm'), desc = $('#f-desc', sh).value.trim();
      if (e) Object.assign(e, {amt: a, cat: c, m: mm, desc});
      else ensureDay(state.day).exp.push({id: uid(), amt: a, cat: c, m: mm, desc, t: Date.now()});
      db.settings.lastCat = c; db.settings.lastMethod = mm;
      if ($('#f-rec', sh)?.checked) {
        const name = desc || CATS[c];

      d.exp = d.exp.filter(x => x.id !== id); pruneDay(state.day); save(); closeSheet(); render(); updateTotals();
    };
  });

/* =====================  backup / ripristino  ===================== */
function downloadFile(file) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function doBackup(forceDownload) {
  const json = JSON.stringify(db);
  const name = `kakebo-backup-${todayKey()}`;
  const variants = [new File([json], name + '.json', {type: 'application/json'}), new File([json], name + '.json.txt', {type: 'text/plain'})];
  let how = null;
  // 1) menu Condividi di Android (permette "Salva su Drive"); se Chrome lo rifiuta si passa al punto 2
  if (!forceDownload && navigator.share && navigator.canShare) {
    for (const f of variants) {
      let ok = false; try { ok = navigator.canShare({files: [f]}); } catch (e) {}
      if (!ok) continue;
      try { await navigator.share({files: [f], title: 'Backup Kakebo'}); how = 'share'; break; }
      catch (err) { if (err && err.name === 'AbortError') return; /* altro errore: provo la variante dopo */ }
    }
  }
  // 2) salvataggio come file nella cartella Download
  if (!how) {
    try { downloadFile(variants[0]); how = 'download'; }
    catch (err) { toast('Backup non riuscito: ' + (err.message || err)); return; }
  }
  db.settings.lastBackup = Date.now(); save();
  toast(how === 'share' ? 'Backup condiviso' : 'Backup salvato nella cartella Download: caricalo su Drive dall\'app File o Drive');
  render();
}
function doRestore(file) {
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d || typeof d.days !== 'object' || d.v !== 1) throw new Error('formato non riconosciuto');
      const n = Object.keys(d.days).length;
      if (!confirm(`Sostituire i dati attuali con il backup (${n} giorni registrati)?`)) return;
      db = norm(d); save(); state.day = todayKey(); state.wk = mondayOf(todayKey()); render(); toast('Backup ripristinato');
    } catch (err) { toast('File non valido: ' + err.message); }
  };
  rd.readAsText(file);
}

/* =====================  eventi  ===================== */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'prev') { state.day = addDays(state.day, -1); render(); updateTotals(); }
  else if (a === 'next') { state.day = addDays(state.day, 1); render(); updateTotals(); }
  else if (a === 'today') { state.day = todayKey(); render(); updateTotals(); }
  else if (a === 'wprev') { state.wk = addDays(state.wk, -7); render(); }
  else if (a === 'wnext') { state.wk = addDays(state.wk, 7); render(); }
  else if (a === 'wtoday') { state.wk = mondayOf(todayKey()); render(); }
  else if (a === 'openbal') openBalSheet();
  else if (a === 'edit') openExpSheet(b.dataset.id);
  else if (a === 'toggrec') { state.recEdit = !state.recEdit; render(); }
  else if (a === 'newrec') openRecurSheet();
  else if (a === 'editrec') openRecurSheet(b.dataset.id);
  else if (a === 'rec') {
    const r = db.recur.find(x => x.id === b.dataset.id); if (!r) return;
    if (r.amt > 0) addExp({amt: r.amt, cat: r.cat, m: r.m, desc: r.name});
    else openExpSheet(null, {cat: r.cat, m: r.m, desc: r.name});
  }
  else if (a === 'imp') { const d = ensureDay(state.day); d.refl.imp = b.dataset.v === '1'; save(); $$('[data-act="imp"]').forEach(x => x.classList.toggle('on', x === b)); }
  else if (a === 'rate') { const i = +b.dataset.i; db.rate[i] = !db.rate[i]; save(); render(); }
  else if (a === 'backup') doBackup();
  else if (a === 'backupfile') doBackup(true);
  else if (a === 'restore') $('#restoreFile').click();
  else if (a === 'chpin') changePin();
  else if (a === 'install') { installEvt.prompt(); installEvt = null; }
  else if (a === 'wipe') {
    if (confirm('Cancellare TUTTI i dati dal telefono? Fai prima un backup.') && confirm('Sei sicuro? L\'operazione non si può annullare.')) {
      localStorage.removeItem(KEY); db = norm({}); state.day = todayKey(); render(); toast('Dati cancellati');
    }
  }
});
app.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'datepick') { if (t.value) { state.day = t.value; render(); updateTotals(); } }
  else if (t.dataset.inc) {
    const v = parseMoney(t.value);
    if (isNaN(v) || v < 0) { t.classList.add('bad'); return; }
    t.classList.remove('bad');
    ensureDay(state.day).inc[t.dataset.inc] = v; pruneDay(state.day); save(); t.value = toInput(v); updateTotals();
  }
  else if (t.dataset.wmoney) {
    const v = parseMoney(t.value);
    if (isNaN(v)) { t.classList.add('bad'); return; }
    t.classList.remove('bad');
    const w = db.weeks[state.wk] ||= {};
    if (t.value.trim() === '') delete w[t.dataset.wmoney]; else w[t.dataset.wmoney] = v;
    save(); t.value = t.value.trim() === '' ? '' : toInput(v) || '0';
  }
  else if (t.id === 'lockSel') { db.settings.lockSec = +t.value; save(); }
  else if (t.id === 'restoreFile') { if (t.files[0]) doRestore(t.files[0]); t.value = ''; }
});
app.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.refl) { ensureDay(state.day).refl[t.dataset.refl] = t.value; pruneDay(state.day); save(); }
  else if (t.dataset.wtext) { (db.weeks[state.wk] ||= {})[t.dataset.wtext] = t.value; save(); }
});
$('#nav').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { state.tab = b.dataset.tab; state.recEdit = false; render(); updateTotals(); } });
$('#fab').addEventListener('click', () => openExpSheet());
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (state.tab === 'set') render(); });

/* =====================  PIN  ===================== */
const getPin = () => { try { return JSON.parse(localStorage.getItem(PIN_KEY)); } catch (e) { return null; } };
const getFail = () => { try { return JSON.parse(localStorage.getItem(FAIL_KEY)) || {n: 0, until: 0}; } catch (e) { return {n: 0, until: 0}; } };
const setFail = f => { try { localStorage.setItem(FAIL_KEY, JSON.stringify(f)); } catch (e) {} };
async function hashPin(pin, salt) {
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const lockEl = $('#lock');
/* tastierino: se len è noto si conferma da solo, altrimenti c'è il tasto OK (4-6 cifre) */
function pinPad({title, sub = '', len = 0, check, forgot, cancelable}) {
  return new Promise(resolve => {
    let digits = '';
    lockEl.hidden = false;
    lockEl.innerHTML = `<h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div>
      <div class="dots">${Array.from({length: len || 6}, () => '<i></i>').join('')}</div>
      <div class="perr" id="perr"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
        <button class="ghost" data-k="${len ? (cancelable ? 'cancel' : '') : 'ok'}">${len ? (cancelable ? 'Annulla' : '') : 'OK'}</button>
        <button data-k="0">0</button><button class="ghost" data-k="del" aria-label="Cancella">⌫</button></div>
      ${forgot ? '<button class="link" id="forgot">PIN dimenticato?</button>' : ''}${!len && cancelable ? '<button class="link" id="pcancel">Annulla</button>' : ''}`;
    const dots = $$('.dots i', lockEl), err = $('#perr', lockEl);
    const paint = () => dots.forEach((d, i) => d.classList.toggle('f', i < digits.length));
    const submit = async () => {
      if (len ? digits.length !== len : digits.length < 4) return;
      const pin = digits;
      if (check) {
        const r = await check(pin);
        if (r !== true) { err.textContent = r; digits = ''; paint(); if (navigator.vibrate) navigator.vibrate(120); return; }
      }
      lockEl.innerHTML = ''; resolve(pin);
    };
    lockEl.onclick = e => {
      const k = e.target.dataset?.k;
      if (e.target.id === 'forgot') { forgot(); return; }
      if (e.target.id === 'pcancel') { lockEl.hidden = true; lockEl.innerHTML = ''; resolve(null); return; }
      if (!k) return;
      err.textContent = '';
      if (k === 'del') digits = digits.slice(0, -1);
      else if (k === 'ok') { submit(); return; }
      else if (k === 'cancel') { lockEl.hidden = true; lockEl.innerHTML = ''; resolve(null); return; }
      else if (digits.length < (len || 6)) digits += k;
      paint();
      if (len && digits.length === len) submit();
    };
  });
}
async function checkPin(pin) {
  const rec = getPin(), f = getFail();
  if (Date.now() < f.until) return `Troppi tentativi. Riprova tra ${Math.ceil((f.until - Date.now()) / 1000)} s`;
  if (await hashPin(pin, rec.salt) === rec.hash) { setFail({n: 0, until: 0}); return true; }
  f.n++; if (f.n % 5 === 0) f.until = Date.now() + 30000 * (f.n / 5);
  setFail(f);
  return f.until > Date.now() ? 'PIN errato. Attendi 30 secondi' : 'PIN errato';
}
async function createPin(cancelable) {
  for (;;) {
    const p1 = await pinPad({title: 'Crea un PIN', sub: 'Da 4 a 6 cifre. Serve per aprire l\'app.', cancelable});
    if (p1 === null) return false;
    const p2 = await pinPad({title: 'Conferma il PIN', sub: 'Inseriscilo di nuovo', len: p1.length, cancelable, check: async p => p === p1 || 'Non coincide, riprova'});
    if (p2 === null) return false;
    const salt = crypto.getRandomValues(new Uint8Array(12)).reduce((a, b) => a + b.toString(16).padStart(2, '0'), '');
    localStorage.setItem(PIN_KEY, JSON.stringify({salt, hash: await hashPin(p1, salt), len: p1.length}));
    return true;
  }
}
async function changePin() {
  const rec = getPin();
  const old = await pinPad({title: 'PIN attuale', len: rec.len, cancelable: true, check: checkPin});
  if (old === null) { lockEl.hidden = true; return; }
  const ok = await createPin(true);
  lockEl.hidden = true;
  toast(ok ? 'PIN cambiato' : 'PIN non modificato');
}
function forgotPin() {
  if (confirm('Il PIN non si può recuperare. Posso cancellare i dati locali e ripartire da zero: potrai poi ripristinare un backup da Impostazioni. Procedere?')) {
    localStorage.removeItem(KEY); localStorage.removeItem(PIN_KEY); localStorage.removeItem(FAIL_KEY); location.reload();
  }
}
let locked = true, unlocking = false;
async function unlock() {
  if (unlocking) return; unlocking = true; locked = true;
  try {
    const first = !getPin();
    if (first) await createPin(false);
    else { const rec = getPin(); await pinPad({title: 'Kakebo', sub: 'Inserisci il PIN', len: rec.len, check: checkPin, forgot: forgotPin}); }
    lockEl.hidden = true; lockEl.innerHTML = ''; locked = false;
    document.documentElement.classList.remove('curtain');
    $('#nav').hidden = false;
    state.day = todayKey(); state.wk = mondayOf(todayKey()); state.lastToday = todayKey();
    render(); updateTotals();
    navigator.storage?.persist?.();
    if (first && !Object.keys(db.days).length) openBalSheet();      // primo avvio: saldi iniziali
  } finally { unlocking = false; }
}
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); document.documentElement.classList.add('curtain'); return; }
  if (!locked && Date.now() - hiddenAt >= db.settings.lockSec * 1000) {
    if (sheetOpen) { sheetOpen = false; sheetRoot.innerHTML = ''; ignorePop++; history.back(); }
    $('#nav').hidden = true; $('#fab').hidden = true; app.innerHTML = '';
    unlock();
  } else if (!locked) {
    document.documentElement.classList.remove('curtain');
    if (state.lastToday !== todayKey()) { state.lastToday = todayKey(); state.day = todayKey(); state.wk = mondayOf(todayKey()); render(); updateTotals(); }
  }
});

if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
unlock();
</script>
